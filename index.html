<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="static/css/index.css">
</head>

<body class="h-full flex flex-col overflow-hidden">

  <!-- Header -->
  <header id="app-header" class="shrink-0 flex items-center justify-between px-5 py-3 border-b fade-in-down">
    <div class="flex items-center gap-3">
      <div id="logo" class="w-8 h-8 rounded-lg flex items-center justify-center font-black text-sm select-none">SV</div>
      <h1 class="text-lg font-bold tracking-tight">Sorting Visualizer</h1>
    </div>
    <div class="flex items-center gap-5 text-sm">
      <div class="flex items-center gap-1.5">
        <span class="stat-label text-xs uppercase tracking-wider opacity-50">Comparisons</span>
        <span id="stat-comparisons" class="font-mono font-bold tabular-nums">0</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="stat-label text-xs uppercase tracking-wider opacity-50">Writes</span>
        <span id="stat-writes" class="font-mono font-bold tabular-nums">0</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="stat-label text-xs uppercase tracking-wider opacity-50">Time</span>
        <span id="stat-time" class="font-mono font-bold tabular-nums">0.0s</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="stat-label text-xs uppercase tracking-wider opacity-50" title="Fastest completion for this algorithm, array type, and size">🏆 Best</span>
        <span id="stat-best" class="font-mono font-bold tabular-nums">–</span>
      </div>
    </div>
  </header>

  <!-- Controls -->
  <div id="app-controls" class="shrink-0 flex flex-wrap items-end gap-4 px-5 py-3 border-b fade-in-down" style="animation-delay: 60ms;">

    <div class="control-group flex flex-col gap-1">
      <label class="text-xs uppercase tracking-wider opacity-50 font-medium">Algorithm</label>
      <select id="algo-select" class="ctrl-select rounded-lg px-3 py-2 text-sm font-medium border focus:outline-none cursor-pointer">
        <option value="bubble">Bubble Sort</option>
        <option value="selection">Selection Sort</option>
        <option value="insertion">Insertion Sort</option>
        <option value="merge">Merge Sort</option>
        <option value="quick">Quick Sort</option>
        <option value="heap">Heap Sort</option>
        <option value="shell">Shell Sort</option>
        <option value="radix">Radix Sort (LSD)</option>
        <option value="cocktail">Cocktail Shaker Sort</option>
        <option value="comb">Comb Sort</option>
      </select>
    </div>

    <div class="control-group flex flex-col gap-1">
      <label class="text-xs uppercase tracking-wider opacity-50 font-medium">
        Array Size: <span id="size-label" class="font-bold not-italic">50</span>
      </label>
      <input type="range" id="size-slider" min="5" max="200" value="50" class="ctrl-range w-28">
    </div>

    <div class="control-group flex flex-col gap-1">
      <label class="text-xs uppercase tracking-wider opacity-50 font-medium">
        Speed: <span id="speed-label" class="font-bold not-italic">Medium</span>
      </label>
      <input type="range" id="speed-slider" min="1" max="100" value="50" class="ctrl-range w-28">
    </div>

    <div class="control-group flex flex-col gap-1">
      <label class="text-xs uppercase tracking-wider opacity-50 font-medium">Array Type</label>
      <select id="array-type" class="ctrl-select rounded-lg px-3 py-2 text-sm font-medium border focus:outline-none cursor-pointer">
        <option value="random">Random</option>
        <option value="nearly_sorted">Nearly Sorted</option>
        <option value="reversed">Reversed</option>
        <option value="few_unique">Few Unique</option>
        <option value="sorted">Already Sorted</option>
        <option value="mountain">Mountain</option>
        <option value="valley">Valley</option>
      </select>
    </div>

    <div class="control-group flex flex-col gap-1">
      <label class="text-xs uppercase tracking-wider opacity-50 font-medium">Theme</label>
      <select id="theme-select" class="ctrl-select rounded-lg px-3 py-2 text-sm font-medium border focus:outline-none cursor-pointer">
        <option value="midnight">Midnight</option>
        <option value="ocean">Ocean</option>
        <option value="neon">Neon</option>
        <option value="sunset">Sunset</option>
        <option value="forest">Forest</option>
        <option value="light">Light</option>
      </select>
    </div>

    <div class="control-group flex flex-col gap-1">
      <label class="text-xs uppercase tracking-wider opacity-50 font-medium">
        Volume: <span id="volume-label" class="font-bold not-italic">50%</span>
      </label>
      <input type="range" id="volume-slider" min="0" max="100" value="50" class="ctrl-range w-24">
    </div>

    <div class="flex-1"></div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-2">
      <button id="btn-mute" title="Toggle sound" class="ctrl-btn-secondary w-10 h-10 flex items-center justify-center rounded-lg text-base border transition-all active:scale-90">
        🔊
      </button>
      <button id="btn-generate" class="ctrl-btn-secondary px-4 py-2 rounded-lg text-sm font-medium border transition-all active:scale-95">
        Generate
      </button>
      <button id="btn-custom" class="ctrl-btn-secondary px-4 py-2 rounded-lg text-sm font-medium border transition-all active:scale-95">
        Custom Input
      </button>
      <button id="btn-sort" class="ctrl-btn-primary px-5 py-2 rounded-lg text-sm font-semibold transition-all active:scale-95">
        ▶ Sort
      </button>
      <button id="btn-pause" class="ctrl-btn-secondary px-4 py-2 rounded-lg text-sm font-medium border transition-all opacity-40 cursor-not-allowed active:scale-95" disabled>
        ⏸ Pause
      </button>
      <button id="btn-step" title="Advance one comparison/swap at a time (→)" class="ctrl-btn-secondary px-4 py-2 rounded-lg text-sm font-medium border transition-all active:scale-95">
        ⏭ Step
      </button>
      <button id="btn-reset" class="ctrl-btn-secondary px-4 py-2 rounded-lg text-sm font-medium border transition-all active:scale-95">
        ↺ Reset
      </button>
    </div>
  </div>

  <!-- Visualization Area -->
  <div id="viz-container" class="flex-1 min-h-0 flex px-5 py-4 fade-in" style="animation-delay: 120ms;">
    <div id="bar-area" class="flex-1 flex items-end rounded-xl overflow-hidden"></div>
  </div>

  <!-- Algorithm Info Footer -->
  <div id="algo-info" class="shrink-0 flex flex-wrap items-center justify-between gap-4 px-5 py-3 border-t">
    <div class="min-w-0">
      <h2 id="algo-name" class="font-semibold text-sm"></h2>
      <p id="algo-desc" class="text-xs opacity-60 mt-0.5 max-w-sm"></p>
    </div>

    <div class="flex items-center gap-5 text-xs font-mono shrink-0">
      <div class="text-center">
        <div class="opacity-40 text-xs uppercase tracking-wider mb-0.5">Best</div>
        <div id="cx-best" class="font-bold"></div>
      </div>
      <div class="text-center">
        <div class="opacity-40 text-xs uppercase tracking-wider mb-0.5">Avg</div>
        <div id="cx-avg" class="font-bold"></div>
      </div>
      <div class="text-center">
        <div class="opacity-40 text-xs uppercase tracking-wider mb-0.5">Worst</div>
        <div id="cx-worst" class="font-bold"></div>
      </div>
      <div class="text-center">
        <div class="opacity-40 text-xs uppercase tracking-wider mb-0.5">Space</div>
        <div id="cx-space" class="font-bold"></div>
      </div>
      <div class="text-center">
        <div class="opacity-40 text-xs uppercase tracking-wider mb-0.5">Stable</div>
        <div id="cx-stable" class="font-bold"></div>
      </div>
    </div>

    <div class="flex items-center gap-3 text-xs shrink-0">
      <div class="flex items-center gap-1.5">
        <div class="w-3 h-3 rounded-sm legend-default"></div>
        <span class="opacity-60">Default</span>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="w-3 h-3 rounded-sm legend-comparing"></div>
        <span class="opacity-60">Comparing</span>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="w-3 h-3 rounded-sm legend-write"></div>
        <span class="opacity-60">Writing</span>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="w-3 h-3 rounded-sm legend-pivot"></div>
        <span class="opacity-60">Pivot</span>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="w-3 h-3 rounded-sm legend-sorted"></div>
        <span class="opacity-60">Sorted</span>
      </div>
    </div>
  </div>

  <!-- Confetti Layer -->
  <div id="confetti-layer" class="fixed inset-0 pointer-events-none z-40 overflow-hidden"></div>

  <!-- Custom Array Modal -->
  <div id="modal" class="fixed inset-0 z-50 flex items-center justify-center modal-hidden">
    <div id="modal-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div id="modal-card" class="relative z-10 rounded-2xl border p-6 w-96 shadow-2xl">
      <h3 class="font-semibold text-base mb-1">Custom Array Input</h3>
      <p class="text-xs opacity-50 mb-3">Enter numbers separated by spaces or commas (e.g. 64 25 12 22 11)</p>
      <textarea id="custom-textarea" rows="3"
        class="ctrl-select w-full rounded-lg p-3 text-sm font-mono border focus:outline-none resize-none"
        placeholder="64 25 12 22 11"></textarea>
      <div class="flex justify-end gap-2 mt-4">
        <button id="modal-cancel" class="ctrl-btn-secondary px-4 py-2 rounded-lg text-sm border">Cancel</button>
        <button id="modal-apply" class="ctrl-btn-primary px-4 py-2 rounded-lg text-sm font-medium">Apply</button>
      </div>
    </div>
  </div>

  <script src="static/js/index.js"></script>
</body>
</html>
