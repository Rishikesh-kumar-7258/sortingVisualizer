<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" initial-scale="1.0">
  <title>Sorting Visualizer</title>

  <!-- BOOTSTRAP CSS-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- STYLE AND SCRIPT -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>

</head>

<body>
  <!-- MAIN BOX   -->
  <div class="container-fluid mx-auto bg-dark p-md-4 d-flex flex-column">

    <!-- BUTTONS AND STUFF -->
    <div class="row mb-3">

      <div class="d-flex flex-row justify-content-between align-items-center">
        <!-- RANDOM NUMBERS BUTTON  -->
        <div class="flex-grow-1 mx-2 row">
          <label for="randomNumbers" class="col-form-label text-white col-md-2 col-xs-6">Elements: </label>
          <div class="col-md-10 col-xs-6">
            <input type="number" class="form-control bg-secondary text-white" id="randomNumbers" value="20">
          </div>
        </div>


        <!-- SPEED BUTTON  -->
        <div class="flex-grow-1 mx-2">
          <select class="form-select bg-secondary text-white" aria-label="Choose visualization speed">
            <option selected>Select Speed</option>
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="3">3x</option>
          </select>
        </div>

        <!-- ALGORITHM BUTTON  -->
        <div class="flex-grow-1 mx-2">
          <select class="form-select bg-secondary text-white" aria-label="Choose visualization algorithm">
            <option selected>Select Algorithm</option>
            <option value="1">Bubble Sort</option>
            <option value="2">Selection Sort</option>
          </select>
        </div>

        <!-- SORT BUTTON  -->
        <div class="mx-2">
          <button class="btn btn-success ">Sort</button>
        </div>
      </div>
    </div>

    <!-- CANVAS -->
    <div class="row flex-grow-1 border">

    </div>

  </div>

  <!-- BOOTSTRAP SCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</body>

</html>
